[tool.poetry]
name = "lyrics-sentiment-analysis"
version = "0.1.0"
description = "Sentiment Analysis using ChatGPT for Song Lyrics"
authors = [
    "Gretchen <gretchen.m.riggs@gmail.com>"
]

[[tool.poetry.source]]
name = "pypi"
priority = "primary"

#####

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
python-dotenv = "^1.0.1"
requests = "^2.32.3"
beautifulsoup4 = "^4.12.3"
openai = "^1.40.8"
streamlit = "^1.38.0"
matplotlib = "^3.9.2"

[tool.poetry.group.polars-legacy]
optional = true

[tool.poetry.group.polars-legacy.dependencies]
polars-lts-cpu = "<1"

[tool.poetry.group.polars]
optional = true

[tool.poetry.group.polars.dependencies]
polars = "<1"
